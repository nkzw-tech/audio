name: push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@v1.20.0
        with:
          node-version: '24'
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run check
        run: vp check

      - name: Install browsers
        run: vp exec playwright install --with-deps chromium webkit

      - name: Run tests
        run: vp run test
